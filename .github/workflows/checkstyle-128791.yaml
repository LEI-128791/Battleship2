#João Nunes
name: Checkstyle gate 128791

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checkstyle:
    name: Checkstyle-128791
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: Checkstyle/checkstyle-128791.xml
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
          fail_level: error
