# 128782 - João Mota
name: Checkstyle gate 128782
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  checkstyle:
    name: checkstyle-128782
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: Checkstyle/checkstyle-128782.xml
          reporter: github-pr-check
          level: error
          filter_mode: nofilter
          fail_level: error
