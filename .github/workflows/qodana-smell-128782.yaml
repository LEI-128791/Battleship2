# 128782 - João Mota
name: Qodana smell gate 128782
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    name: qodana-128782
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2026.2
        with:
          # O projeto Maven esta na subpasta Battleship2-main.
          args: --project-dir Battleship2-main --config qodana-128782.yaml
          # Analisa o projeto inteiro (e nao so os ficheiros alterados no PR),
          # porque o limite de problemas (failureConditions) e para o projeto todo.
          pr-mode: false
          upload-result: true
          use-annotations: true
          post-pr-comment: true
