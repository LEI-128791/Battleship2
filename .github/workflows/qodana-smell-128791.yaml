# 128791 - João Nunes
name: Qodana smell gate 128791
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config,.qodana/qodana-128791.yaml
          pr-mode: false
          upload-result: true
          use-annotations: true
          post-pr-comment: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}