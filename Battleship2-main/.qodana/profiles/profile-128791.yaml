version: "1.0"
profile:
  base:
    name: empty
  inspections:
    - inspection: MethodWithTooManyParameters
      enabled: true
      severity: WARNING
      options:
        m_limit: 5
    - inspection: ConstructorWithTooManyParameters
      enabled: true
      severity: WARNING
      options:
        m_limit: 5
        ignoreScope: none
